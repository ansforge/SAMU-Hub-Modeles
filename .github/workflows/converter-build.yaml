name: Build converter image

on:
  push:
    tags:
      - "converter-*"
  workflow_dispatch:
  # Called by release-module.yml: a tag it pushes with GITHUB_TOKEN does not
  # trigger the push event above. The github context is the caller's there,
  # so the tag comes as an input.
  # doc : https://docs.github.com/en/actions/concepts/security/github_token#when-github_token-triggers-workflow-runs
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, (ex: converter-2.12.1)"
        required: true
        type: string

jobs:
  build-converter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Extract version from tag
        id: extract-version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=${TAG_NAME#converter-}
          PATTERN="^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)*$"
          if [[ ! "$VERSION" =~ $PATTERN ]]; then
            echo "Invalid version number. Expected format: x.y.z with optional '-rc.n' (e.g., 1.2.3 or 1.2.3-rc.1)"
            echo $VERSION
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push converter service Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/hub-converter:${{ steps.extract-version.outputs.version }}
          context: ./converter
          build-args: CONVERTER_VERSION=${{ steps.extract-version.outputs.version }}
